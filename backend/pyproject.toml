[project]
name = "inky-dash"
version = "0.1.0"
description = "E-ink dashboard for a Pimoroni Inky Impression Spectra 7.3 with a web config UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pillow>=12",  # tests use Image.get_flattened_data (12+); getdata is deprecated
    "httpx>=0.27",
    "feedparser>=6.0",
    "bleak>=0.22",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "python-multipart>=0.0.9",  # photo uploads from the config UI
]

[project.optional-dependencies]
pi = ["inky>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inky_dash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette nudging its TestClient toward httpx2. Test-only: the app itself
    # never imports TestClient. Drop this once starlette/httpx settle.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
